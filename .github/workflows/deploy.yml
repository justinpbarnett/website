name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html contact.html work.html resume.html Justin_Barnett_Resume.pdf robots.txt sitemap.xml dist/
          cp -R assets dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c194df16fa381249dec25d238b8dd351
          command: pages deploy dist --project-name=justinpbarnett --branch=main --commit-dirty=true
