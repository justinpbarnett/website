name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html contact.html work.html resume.html Justin_Barnett_Resume.pdf robots.txt sitemap.xml dist/
          cp -R assets dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c194df16fa381249dec25d238b8dd351
          command: pages deploy dist --project-name=justinpbarnett --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Print deployment URL
        run: echo "Deployment URL: ${{ steps.deploy.outputs.deployment-url }}"
